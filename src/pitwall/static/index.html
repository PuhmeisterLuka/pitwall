<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pitwall</title>
  <meta name="description" content="Formula 1 results and timing, merged from Jolpica-F1 and OpenF1.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf6f1">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1512">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%236b4430' stroke-width='20'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#race">Skip to the race</a>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="./"><span>pit<span class="accent">wall</span></span></a>
      <div class="filters" role="group" aria-label="Choose a race">
        <button class="btn icon" type="button" id="prev" aria-label="Previous round">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <label class="field season">
          <span class="sr-only">Season</span>
          <select class="select-el" id="season"></select>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </label>
        <label class="field round">
          <span class="sr-only">Round</span>
          <select class="select-el" id="round"></select>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </label>
        <button class="btn icon" type="button" id="next" aria-label="Next round">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <p class="sr-only" id="status" aria-live="polite"></p>
    <div id="race"><p class="notice">Loading the latest race…</p></div>
    <footer class="site-foot">
      <p>Results from <a href="https://github.com/jolpica/jolpica-f1">Jolpica-F1</a>, timing from <a href="https://openf1.org">OpenF1</a>. Not affiliated with Formula 1.</p>
    </footer>
  </main>
</body>
</html>
